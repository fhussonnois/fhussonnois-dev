{{ define "main" }}

{{ partial "hero.html" . }}

<div class="container">
  <h2 class="section-heading"><span class="hash">#</span> Latest Posts</h2>
  {{ $years := (where .Site.RegularPages "Section" "posts").GroupByDate "2006" }}
  <div class="year-sections">
    {{ range $years }}
    <section class="year-section" id="year-{{ .Key }}" aria-labelledby="year-{{ .Key }}-heading">
      <h3 class="year-heading" id="year-{{ .Key }}-heading">{{ .Key }}</h3>
      <div class="post-grid">
        {{ range .Pages }}
        {{ partial "post-card.html" . }}
        {{ end }}
      </div>
    </section>
    {{ end }}
  </div>
</div>

{{ end }}
